name: Publish Package to npmjs
on:
  release:
    types: [published]
jobs:
  publish-npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Verify release identity and trusted-publishing environment
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/verify-release-identity.mjs --require-oidc --require-unpublished
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run check:type
      - name: Run unit tests with coverage
        run: pnpm run test:coverage
      - name: Check package exports
        run: pnpm run test:exports
      - name: Check isolated package tarball
        run: node scripts/verify-package-tarball.mjs --skip-build
      - name: Check React Native Jest integration
        run: pnpm run test:rn:integration
      - name: Install Chromium for rollback rehearsal
        run: pnpm exec playwright install --with-deps chromium
      - name: Enforce 2.1.0 performance regression budgets
        run: node scripts/compare-v2.1-baseline.mjs --skip-build --skip-legacy-probes
      - name: Require published 2.1 bridge rollback evidence
        run: node scripts/rehearse-data-rollback.mjs --require-published --skip-candidate-build
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          CI: true
