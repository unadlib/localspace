name: Detox iOS RC E2E (manual)

on:
  workflow_dispatch:
    inputs:
      package_spec:
        description: Exact published RC, for example localspace@3.0.0-rc.1
        required: true
        type: string

concurrency:
  group: detox-ios-rc-${{ inputs.package_spec }}
  cancel-in-progress: false

env:
  DETOX_APP_DIR: integration/react-native-detox
  NODE_VERSION: '24'

jobs:
  ios-sim:
    name: Detox iOS Simulator (${{ inputs.package_spec }})
    runs-on: macos-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.DETOX_APP_DIR }}
    steps:
      - name: Checkout release fixture
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install pinned workspace dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Resolve and verify exact published RC tarball
        id: rc
        working-directory: .
        env:
          PACKAGE_SPEC: ${{ inputs.package_spec }}
        run: |
          RC_OUTPUT_DIR="$RUNNER_TEMP/localspace-detox-rc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          node scripts/prepare-detox-rc.mjs \
            --package-spec "$PACKAGE_SPEC" \
            --output-directory "$RC_OUTPUT_DIR" \
            --expected-commit "$GITHUB_SHA"

      - name: Replace workspace dependency with exact RC tarball
        working-directory: .
        env:
          RC_TARBALL: ${{ steps.rc.outputs.tarball_path }}
        run: pnpm --filter localspace-detox-fixture add --save-exact "$RC_TARBALL"

      - name: Verify installed RC identity and package surface
        working-directory: .
        env:
          RC_METADATA: ${{ steps.rc.outputs.metadata_path }}
        run: |
          node scripts/verify-detox-rc-install.mjs \
            --fixture "$DETOX_APP_DIR" \
            --metadata "$RC_METADATA"

      - name: Install applesimutils
        run: |
          brew tap wix/brew
          brew install applesimutils

      - name: Install Ruby dependencies
        run: bundle install

      - name: Detect iOS simulator device
        run: |
          IOS_DEVICE_TYPE="$(
            xcrun simctl list devicetypes \
              | sed -n 's/^[[:space:]]*\(iPhone[^()]*\) (com\.apple\.CoreSimulator\.SimDeviceType\..*)$/\1/p' \
              | head -n 1
          )"
          if [ -z "$IOS_DEVICE_TYPE" ]; then
            echo "Unable to detect an available iPhone simulator type."
            xcrun simctl list devicetypes
            exit 1
          fi
          echo "Using iOS simulator device type: $IOS_DEVICE_TYPE"
          echo "DETOX_IOS_DEVICE_TYPE=$IOS_DEVICE_TYPE" >> "$GITHUB_ENV"

      - name: Install CocoaPods
        run: |
          if [ -f "ios/Podfile" ]; then
            cd ios
            bundle exec pod install --repo-update
          fi

      - name: Build iOS app for Detox
        run: pnpm run build:ios:detox

      - name: Run Detox tests on iOS simulator
        run: pnpm run test:ios:detox

      - name: Upload RC identity and iOS artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detox-ios-rc-${{ steps.rc.outputs.version || 'unresolved' }}
          path: |
            ${{ steps.rc.outputs.metadata_path }}
            ${{ env.DETOX_APP_DIR }}/artifacts
            ${{ env.DETOX_APP_DIR }}/.detox
          if-no-files-found: warn
