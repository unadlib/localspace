name: Node CI

on:
  push:
  pull_request:

jobs:
  node:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    env:
      CI: 'true'

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check types
        run: pnpm check:type
      - name: Run unit tests on Node.js 22
        if: matrix.node-version == '22.x'
        run: pnpm test:unit
      - name: Run unit tests with coverage on Node.js 24
        if: matrix.node-version == '24.x'
        run: pnpm test:coverage
      - name: Build package
        run: pnpm build
      - name: Verify package exports
        run: node test/package-exports.cjs
      - name: Verify package declaration consumers
        run: pnpm test:types:package
      - name: Verify isolated package tarball
        run: node scripts/verify-package-tarball.mjs --skip-build
      - name: Verify React Native Jest integration
        if: matrix.node-version == '24.x'
        run: pnpm test:rn:integration

  browsers:
    name: Playwright ${{ matrix.browser }}
    runs-on: ubuntu-latest
    env:
      CI: 'true'

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4
        with:
          # The Chromium release rehearsal archives the pinned 2.1 bridge
          # commit, so a depth-1 checkout cannot satisfy this job.
          fetch-depth: 0
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Record exact browser engine evidence
        run: node scripts/report-browser-evidence.mjs ${{ matrix.browser }}
      - name: Build package
        run: pnpm build
      - name: Run ${{ matrix.browser }} tests
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      - name: Enforce 2.1.0 performance regression budgets
        if: matrix.browser == 'chromium'
        run: node scripts/compare-v2.1-baseline.mjs --skip-build --skip-legacy-probes

      - name: Rehearse 2.1 bridge to 3.0 data rollback
        if: matrix.browser == 'chromium'
        run: node scripts/rehearse-data-rollback.mjs --skip-candidate-build

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}-traces
          path: test-results
          if-no-files-found: ignore
